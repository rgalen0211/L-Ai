# External monitor + Supabase keep-alive (WEB, 2026-10-10). NOT ENABLED until this branch is reviewed and merged.
# Every 6 hours: touches the database (a free project pauses after a week of no activity), fetches the public page, and asks
# service_status() whether rendering is alive. It uses only the PUBLIC key already in assets/ryagram-config.js: no secrets.
# A failing run makes GitHub email the repository owner, which works even when Supabase itself is down.
# Merge this ONLY after the SQL migration is applied (until then service_status does not exist and the run fails).
# Until WORKER adds worker_ping(), rendering is 'unknown' and does NOT fail the run.
name: ops-ping
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the page, the database and rendering
        run: |
          url=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" assets/ryagram-config.js | head -1)
          key=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" assets/ryagram-config.js | head -1)
          test -n "$url" && test -n "$key" || { echo "no public config found"; exit 1; }
          curl -fsS --max-time 30 https://uselai.com/ryagram/ | grep -qi "ryagram" || { echo "Ryagram page did not load"; exit 1; }
          out=$(curl -fsS --max-time 30 -X POST "$url/rest/v1/rpc/service_status" -H "apikey: $key" -H "Content-Type: application/json" -d '{}') \
            || { echo "Supabase did not answer (paused or down?)"; exit 1; }
          echo "service_status: $out"
          case "$out" in *'"delayed"'*) echo "Rendering is delayed (the render PC has not checked in)"; exit 1;; esac
