<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://jxtkfishqfxuptwjzczz.supabase.co wss://jxtkfishqfxuptwjzczz.supabase.co; img-src 'self' data: https://jxtkfishqfxuptwjzczz.supabase.co; media-src https://jxtkfishqfxuptwjzczz.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Ryagram | L'Ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@100&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/app.css?v=20261004h">
</head>
<body class="ryagram-app">
<header><div class="container nav"><a class="brand" href="/ryagram/" aria-label="Ryagram"><span class="wordmark" aria-hidden="true">L'Ai</span><span class="brand-copy">Ryagram</span></a><div class="app-account" id="account" hidden><a id="account-email" href="#/account" title="Your account"></a><button class="button secondary" id="sign-out" type="button">Sign out</button></div></div></header>
<main class="container app-main">
  <p id="app-status" class="app-status" role="status" tabindex="-1" hidden></p>

  <section id="sign-in" class="app-panel" hidden aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">Sign in</h1>
    <p class="form-intro">Ryagram is invite-only for now.</p>
    <p id="invite-row" hidden><button class="link-button" id="have-invite" type="button" aria-expanded="false" aria-controls="invite-form">Have an invite code?</button></p>
    <form id="invite-form" class="contact-form" hidden>
      <label for="iv-code">Invite code</label>
      <input id="iv-code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="RYA-XXXX-XXXX" required>
      <label for="iv-email">Your email</label>
      <input id="iv-email" name="email" type="email" autocomplete="email" required>
      <button class="button primary" type="submit">Join</button>
      <p id="invite-note" class="form-note" role="status"></p>
    </form>
    <form id="sign-in-form" class="contact-form">
      <label for="si-email">Email</label>
      <input id="si-email" name="email" type="email" autocomplete="username" required>
      <label for="si-password">Password</label>
      <input id="si-password" name="password" type="password" autocomplete="current-password" required>
      <button class="button primary" type="submit">Sign in</button>
      <p id="sign-in-error" class="form-note app-error" role="alert" hidden></p>
    </form>
    <p id="forgot-row" hidden><button class="link-button" id="forgot" type="button" aria-expanded="false" aria-controls="reset-form">Forgot your password?</button></p>
    <form id="reset-form" class="contact-form" hidden>
      <label for="rs-email">Email for the reset link</label>
      <input id="rs-email" name="email" type="email" autocomplete="username" required>
      <button class="button secondary" type="submit">Send a reset link</button>
      <p id="reset-note" class="form-note" role="status"></p>
    </form>
  </section>

  <section id="set-password" class="app-panel" hidden aria-labelledby="set-password-title">
    <h1 id="set-password-title" tabindex="-1">Choose a new password</h1>
    <form id="set-password-form" class="contact-form">
      <label for="np-password">New password (at least 10 characters)</label>
      <input id="np-password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <label for="np-again">The same again</label>
      <input id="np-again" name="again" type="password" autocomplete="new-password" minlength="10" required>
      <button class="button primary" type="submit">Save the new password</button>
      <p id="set-password-error" class="form-note app-error" role="alert" hidden></p>
    </form>
  </section>

  <section id="library" class="app-panel" hidden></section>
</main>
<script src="/assets/ryagram-config.js?v=20261004h"></script>

<script src="/assets/app-data.js?v=20261004h"></script>
<script src="/assets/app-jobs.js?v=20261004h"></script>
<script src="/assets/app-templates.js?v=20261004h"></script>
<script src="/assets/app-credits.js?v=20261004h"></script>
<script src="/assets/app-sources.js?v=20261004h"></script>
<script src="/assets/app-uploads.js?v=20261004h"></script>
<script src="/assets/app-admin.js?v=20261004h"></script>
<script src="/assets/app-library.js?v=20261004h"></script>
<script src="/assets/app-auth.js?v=20261004h"></script>
</body>
</html>
