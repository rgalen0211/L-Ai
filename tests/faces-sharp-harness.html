<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Faces panel harness (test page, not shipped)</title>
<style>body{font:16px system-ui;margin:16px;max-width:760px}.fs-faces,.fs-people{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px}.fs-face{border:1px solid #888;padding:8px;border-radius:8px;min-width:120px}.is-sharp{outline:3px solid #2a7}.fs-nothumb{display:inline-block;width:96px;height:96px;background:#ddd}button,select,input[type=text]{min-height:44px;font:inherit}input[type=checkbox]{width:24px;height:24px}</style></head>
<body><main id="root"></main>
<script src="/assets/app-faces-sharp.js"></script>
<script>
// A fake engine that follows the spec's words (the page does not hold the rule). Test page only.
const clone = s => JSON.parse(JSON.stringify(s));
const resolve = s => { for (const t of s.tracks) { const p = s.people.find(q => q.name === t.person); if (t.person && p && p.consent === true) Object.assign(t, { kept: true, consent: true, name: p.name }); else if (t.person) Object.assign(t, { kept: false, consent: false, name: '' }); } return s; };
const host = { faces: {
  async status(s) { return s.tracks.filter(t => t.kept === true && t.consent === true && t.name).map(t => t.id); },
  async confirm(s, n, c) { if (!n) throw new Error("Type the person's name to leave their face sharp."); if (c !== true) throw new Error("Tick that you have this person's OK before their face is left sharp."); s = clone(s); s.people.push({ name: n, consent: true }); return resolve(s); },
  async revoke(s, n) { s = clone(s); s.people.forEach(p => { if (p.name === n) p.consent = false; }); return resolve(s); },
  async link(s, id, n) { s = clone(s); if (!s.people.find(p => p.name === n)) throw new Error('Confirm this person first (their name and that you have their OK) before linking their face.'); s.tracks.find(t => t.id === id).person = n; return resolve(s); },
  async unlink(s, id) { s = clone(s); const t = s.tracks.find(x => x.id === id); t.person = null; Object.assign(t, { kept: false, consent: false, name: '' }); return s; } } };
const spec = { schema: 1, on: true, frame: [1920, 1080], people: [], tracks: ['a', 'b', 'c'].map((id, i) => ({ id, kf: [[0, i, i, 2, 2]], n: 5, score: .9, kept: false, consent: false, name: '', person: null })) };
window.lastSpec = spec;
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v === false || v === null || v === undefined) continue; if (k === 'onclick') el.addEventListener('click', v); else if (k === 'value') el.value = v; else if (v === true) el.setAttribute(k, ''); else el.setAttribute(k, v); }
  const add = k => { if (Array.isArray(k)) k.forEach(add); else if (k !== null && k !== undefined && k !== false) el.append(k); };
  kids.forEach(add); return el;
};
document.getElementById('root').append(window.ryagramFacesSharp.create({ h }).panel({ spec, host, offered: ['Ann', 'Bob'], thumbs: {}, onChange: s => { window.lastSpec = s; } }));
</script></body></html>
