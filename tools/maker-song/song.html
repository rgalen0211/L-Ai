<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Make a song</title>
<link rel="stylesheet" href="song.css">
</head>
<body>
<main>
  <header class="top" id="top"></header>
  <p class="vh" id="live" role="status" aria-live="polite"></p>
  <p id="msg" class="msg" role="alert"></p>
  <section class="panel" id="s-words" aria-label="Your words"></section>
  <section class="panel" id="s-videos" aria-label="Your videos"></section>
  <section class="panel" id="s-music" aria-label="Your music"></section>
  <section class="panel" id="s-board" aria-label="Your song, word by word" hidden></section>
  <audio id="player" preload="none"></audio>
  <p class="note">Nothing here is uploaded. The words and the music stay on this computer, and only the render makes anything.</p>
</main>
<script src="song-model.js"></script>
<script src="song.js"></script>
</body>
</html>
